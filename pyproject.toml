[project]
name = "recipe-hackathon"
version = "0.1.0"
description = "Parse cookbook epubs into a recipe database"
requires-python = ">=3.11"
dependencies = [
    "torch >= 2.11.0",
    "requests>=2.31",
    "duckdb>=1.0",
    "numpy>=2.4.6",
    "unsloth>=2026.9.7",
    "fire>=0.7.1",
    "spacy>=3.8.16",
    "en-core-web-sm",
    "sentence-transformers>=6.1.0",
    "tensorboard>=2.21.0",
    "pyqt6>=6.11.0",
]

[dependency-groups]
dev = ["pytest>=8"]

# Without a build-system uv calls this a virtual project and never installs it,
# which is why src/ was invisible to anything but pytest. With one, `uv run`
# installs the project into the venv in editable mode, so `import settings`
# works from scripts/, finetune/ and tests/ alike.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src/ holds loose modules, not a package directory, so name the source root
# rather than a package: sources strips the src/ prefix, only-include keeps the
# wheel from picking up scripts/ and finetune/.
[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["scripts"]  # scripts/ is not a package; this makes it importable
addopts = "-x -s"

[tool.pyright]
extraPaths = ["src"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
